# ros_gz_bridge config for the multi-robot ignition world spawned by
# spawn_robots_ignition.launch.xml (limo_dif: limo_multi_ignition.xacro,
# limo_acker: limo_multi_acker_ignition.xacro, limo_omni: limo_multi_omni_ignition.xacro).
# consumed by: ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:=<this file>
#
# cmd_vel for limo_dif/limo_acker is NOT namespaced in the xacro (the
# DiffDrive/AckermannSteering systems in this gz-sim build have no <topic>
# override for it) -- it is always published on the entity-scoped default
# "/model/<name>/cmd_vel", where <name> is the -name given at spawn time
# (== robot_name). limo_omni uses VelocityControl, which does support an
# explicit <topic>, so it is namespaced the same as everything else.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

